<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Llave CUU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Schibsted+Grotesk:wght@400;500;600&display=swap">
<style>
:root{
  --outer:#E8E1D0; --bg:#F4EFE4; --surface:#FBF8F1; --ink:#2A251C; --muted:#6F6552;
  --line:rgba(42,37,28,.16); --bronze:#C9A66B; --bronze-ink:#7A5B24;
  --card:#2A251C; --card-ink:#F4EFE4; --card-line:rgba(201,166,107,.35);
  --ok:#3F6B4A; --warn:#9B3B2A;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --sans:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --outer:#120F0B; --bg:#1D1913; --surface:#26211A; --ink:#F4EFE4; --muted:#A79C86;
    --line:rgba(244,239,228,.16); --bronze-ink:#C9A66B;
    --card:#3A3324; --card-ink:#F4EFE4; --card-line:rgba(201,166,107,.5);
    --ok:#7FB68C; --warn:#E08A75;
  }
}
:root[data-theme="dark"]{
  --outer:#120F0B; --bg:#1D1913; --surface:#26211A; --ink:#F4EFE4; --muted:#A79C86;
  --line:rgba(244,239,228,.16); --bronze-ink:#C9A66B;
  --card:#3A3324; --card-ink:#F4EFE4; --card-line:rgba(201,166,107,.5);
  --ok:#7FB68C; --warn:#E08A75;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--outer);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--bronze);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);border-inline:1px solid var(--line);padding:22px 20px 120px}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0;letter-spacing:-.01em}
h1{font-size:38px;line-height:1.05}
h2{font-size:27px;line-height:1.1}
h3{font-size:21px;line-height:1.15}
p{margin:0}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.stack>*+*{margin-top:14px}

/* marca */
.brand{display:flex;align-items:center;gap:8px}
.brand svg{width:30px;height:30px;color:var(--ink)}
.wm{font-family:var(--serif);font-size:26px;line-height:1}
.cuu{font-size:11px;letter-spacing:.22em;color:var(--muted);align-self:flex-end;padding-bottom:3px}
.avatar{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-family:var(--serif);font-size:19px}

/* tarjeta */
.card{position:relative;overflow:hidden;background:var(--card);color:var(--card-ink);border-radius:20px;aspect-ratio:1.586/1;padding:20px 22px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid var(--card-line)}
.card .peaks{position:absolute;right:-6px;bottom:-4px;width:64%;color:var(--bronze);opacity:.9;pointer-events:none}
.card .top{display:flex;align-items:center;gap:8px;position:relative}
.card .top svg{width:26px;height:26px;color:var(--card-ink)}
.card .top .wm{font-size:24px}
.card .top .cuu{color:var(--bronze)}
.card .who{position:relative}
.card .who .n{font-family:var(--serif);font-size:30px;line-height:1.05}
.card .who .u{font-size:13px;opacity:.75;margin-top:4px}
.card .meta{position:relative;display:flex;gap:26px;font-size:12px}
.card .meta b{display:block;font-weight:500;font-size:14px;margin-top:1px}
.card .meta span{opacity:.65}
.settle{animation:settle .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes settle{from{opacity:0;transform:translateY(18px) rotate(-2.2deg)}to{opacity:1;transform:none}}

/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:12px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font-weight:500;width:100%}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.small{min-height:38px;width:auto;padding:0 14px;font-size:14px}
.btn:active{transform:scale(.985)}
.link{background:none;border:0;padding:6px 0;color:var(--bronze-ink);font-weight:500;text-decoration:underline;text-underline-offset:3px}

/* secciones y listas */
.sec{margin-top:34px}
.sec>.row{margin-bottom:8px}
.list{border-top:1px solid var(--line)}
.item{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none;border-inline:0;border-top:0}
.ico{flex:none;width:44px;height:44px;border-radius:50%;background:color-mix(in srgb,var(--bronze) 22%,transparent);display:grid;place-items:center;color:var(--bronze-ink)}
.ico svg{width:22px;height:22px}
.item .t{flex:1;min-width:0}
.item .t h3{font-size:20px}
.item .t .b{font-weight:500;font-size:14px;margin-top:2px}
.item .t .m{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:2px}
.heart{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:none;display:grid;place-items:center;color:var(--muted)}
.heart svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7}
.heart.on{color:var(--warn)}
.heart.on svg{fill:currentColor}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;margin:0 -20px;padding-inline:20px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 14px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.field{display:block}
.field span{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.inp{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px}
.search{position:relative}
.search svg{position:absolute;left:14px;top:14px;width:20px;height:20px;color:var(--muted)}
.search .inp{padding-left:44px}

/* checklist */
.check{display:flex;gap:14px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.box{flex:none;width:26px;height:26px;border-radius:8px;border:1.5px solid var(--muted);background:none;display:grid;place-items:center;color:var(--bg);padding:0}
.box[aria-checked="true"]{background:var(--ok);border-color:var(--ok)}
.box svg{width:16px;height:16px;opacity:0}
.box[aria-checked="true"] svg{opacity:1}
.check.done .lbl{text-decoration:line-through;color:var(--muted)}
.check .lbl{flex:1}

/* stats */
.big{font-family:var(--serif);font-size:56px;line-height:1}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.kpis>div{padding:14px 0 14px 14px;border-left:1px solid var(--line)}
.kpis>div:first-child{border-left:0;padding-left:0}
.kpis .v{font-family:var(--serif);font-size:32px;line-height:1}
.kpis .l{font-size:12px;color:var(--muted);margin-top:4px}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--sans);font-size:10px;fill:var(--muted)}

/* hoja inferior */
.backdrop{position:fixed;inset:0;background:rgba(20,16,10,.55);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(480px,100%);max-height:90vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:14px 22px calc(26px + env(safe-area-inset-bottom,0px));animation:up .28s ease-out both}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 16px}
.dl{margin:16px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.dl dt{color:var(--muted)}
.dl dd{margin:0}
.benefit{font-family:var(--serif);font-size:34px;line-height:1.05;margin:14px 0 6px}
.codewrap{display:grid;place-items:center;margin:18px 0 6px;position:relative}
.codewrap svg{width:190px;height:190px;transform:rotate(-90deg)}
.codewrap .c{position:absolute;text-align:center}
.code{font-family:var(--serif);font-size:44px;letter-spacing:.08em;line-height:1}
.expired .code{color:var(--muted);text-decoration:line-through}

/* barra inferior */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);background:var(--bg);border-top:1px solid var(--line);display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:20}
.tab{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:12px;color:var(--muted);border-radius:10px}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--ink);font-weight:600}
.tab[aria-current="page"] svg{color:var(--bronze-ink)}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:40;animation:up .2s ease-out both}
.result{padding:14px 16px;border-radius:12px;border:1px solid var(--line);margin-top:14px}
.result.ok{border-color:var(--ok)}
.result.bad{border-color:var(--warn)}
.tag{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--muted)}
.hero{padding-top:8px}
.hero svg.iso{width:64px;height:64px;color:var(--ink)}
.empty{padding:26px 0;text-align:left}
@media (prefers-reduced-motion: reduce){
  .settle,.sheet,.toast{animation:none}
}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="layer"></div>
<div id="toast-slot"></div>

<script>
(function(){
"use strict";

/* ---------- datos de ejemplo ---------- */
var CATS = [
  {id:"restaurantes", label:"Restaurantes"},
  {id:"gimnasios",    label:"Gimnasios"},
  {id:"barberias",    label:"Barberías"},
  {id:"lavanderias",  label:"Lavanderías"}
];
var BIZ = [
  {id:"fonda-mirada",   name:"Fonda La Mirada",            cat:"restaurantes", zona:"Col. Centro",        hours:"7:00 a 15:00",  benefit:"2×1 en desayunos",            info:"Pide dos desayunos iguales y paga uno. Válido de lunes a viernes antes de las 11:00.", save:70,  feat:true},
  {id:"taqueria-paleton",name:"Taquería El Paletón",       cat:"restaurantes", zona:"Zona Universitaria", hours:"13:00 a 23:00", benefit:"15% de descuento en tu cuenta",info:"Aplica en consumo en mesa y para llevar. Un canje por visita.", save:35, feat:true},
  {id:"cafe-meseta",    name:"Café Meseta",                cat:"restaurantes", zona:"Col. Campestre",     hours:"8:00 a 21:00",  benefit:"Bebida de regalo con tu comida",info:"Con cualquier alimento, elige una bebida caliente o fría de tamaño chico.", save:40},
  {id:"tarahumara-fit", name:"Gimnasio Tarahumara Fit",    cat:"gimnasios",    zona:"Zona Universitaria", hours:"6:00 a 22:00",  benefit:"Primera semana gratis",       info:"Acceso completo durante siete días e inscripción sin costo si te quedas.", save:250, feat:true},
  {id:"studio-andale",  name:"Studio Ándale",              cat:"gimnasios",    zona:"Col. Campestre",     hours:"7:00 a 20:00",  benefit:"2 clases de prueba gratis",   info:"Reserva por mensaje y presenta tu código al llegar. Una vez por miembro.", save:180},
  {id:"cerro-grande",   name:"Barbería Cerro Grande",      cat:"barberias",    zona:"Col. Centro",        hours:"10:00 a 20:00", benefit:"20% en corte clásico",        info:"Descuento en corte clásico de lunes a jueves. Con cita se atiende más rápido.", save:40, feat:true},
  {id:"navaja-hoja",    name:"Navaja y Hoja",              cat:"barberias",    zona:"Col. San Felipe",    hours:"10:00 a 19:00", benefit:"15% en corte y barba",        info:"Aplica al combo de corte y barba. No incluye productos.", save:45},
  {id:"cuarto-limpio",  name:"Lavandería Cuarto Limpio",   cat:"lavanderias",  zona:"Zona Universitaria", hours:"8:00 a 20:00",  benefit:"Cada 4.ª carga va por la casa",info:"Suma tus visitas: en tu cuarta carga lavas gratis. Incluye secado.", save:60, feat:true},
  {id:"ropa-sol",       name:"Lavandería Ropa al Sol",     cat:"lavanderias",  zona:"Col. Nombre de Dios",hours:"8:00 a 19:00",  benefit:"10% y secado gratis",         info:"Descuento en lavado por carga, con secado sin costo. De lunes a sábado.", save:30}
];
var FIRST_WEEK = [
  {id:"fw1", text:"Ubica tu lavandería más cercana", cat:"lavanderias"},
  {id:"fw2", text:"Desayuna con tu primer 2×1",       cat:"restaurantes"},
  {id:"fw3", text:"Pasa a conocer un gimnasio",       cat:"gimnasios"},
  {id:"fw4", text:"Encuentra una barbería de confianza", cat:"barberias"}
];
var UNIS = ["UACH","Tec de Monterrey Campus Chihuahua","TecNM Chihuahua","La Salle Chihuahua","UTCH","UVM Chihuahua","Otra universidad"];

/* ---------- iconos ---------- */
var P = {
  restaurantes:'<path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 2-3 5-3 8h3v10"/>',
  gimnasios:'<path d="M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12"/>',
  barberias:'<circle cx="6" cy="6" r="2.6"/><circle cx="6" cy="18" r="2.6"/><path d="M8 7.6L20 18M8 16.4L20 6"/>',
  lavanderias:'<rect x="4" y="3" width="16" height="18" rx="2"/><circle cx="12" cy="13" r="4"/><path d="M4 7h16"/>',
  home:'<path d="M3 11l9-8 9 8M5 10v10h14V10"/>',
  explore:'<circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/>',
  redeemed:'<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>',
  profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
  panel:'<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>',
  validate:'<path d="M5 12l5 5L20 7"/>'
};
function ic(name,extra){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" '+(extra||'')+'>'+P[name]+'</svg>';
}
var HEART = '<svg viewBox="0 0 24 24" aria-hidden="true"><path stroke-linejoin="round" d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2 4 4 0 0 1 7 2c0 5.5-7 10-7 10z"/></svg>';
var CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>';
function iso(cls){
  return '<svg class="'+(cls||'')+'" viewBox="0 0 64 64" fill="none" aria-hidden="true">'+
    '<path d="M2 58L20 36l10 10 14-20 18 32z" fill="#C9A66B" fill-opacity=".55"/>'+
    '<circle cx="19" cy="27" r="9" stroke="currentColor" stroke-width="3.2"/>'+
    '<path d="M28 27h30M50 27v9M56 27v6" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></svg>';
}
function peaks(){
  return '<svg class="peaks" viewBox="0 0 200 110" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true">'+
    '<path d="M0 108L52 40l26 30 40-58 50 60 32 36"/>'+
    '<path d="M0 108L40 66l20 20 30-40 36 46"/><path d="M52 40l-10 14M118 12l-14 22M118 12l12 20"/></svg>';
}

/* ---------- estado ---------- */
var KEY = "llave-cuu-v1";
var state = load() || {user:null, favs:[], checks:[], redeemed:[], codes:{}, theme:"auto"};
var ui = {tab:"home", filter:"todos", q:"", mode:"student", btab:"panel", bizId:"cerro-grande", settled:false, timer:null};
function load(){ try{ var r=localStorage.getItem(KEY); if(r) return JSON.parse(r); }catch(e){} return null; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function biz(id){ for(var i=0;i<BIZ.length;i++) if(BIZ[i].id===id) return BIZ[i]; return null; }
function cat(id){ for(var i=0;i<CATS.length;i++) if(CATS[i].id===id) return CATS[i]; return null; }
function mxn(n){ return "$"+Number(n).toLocaleString("es-MX")+" MXN"; }
function fdate(ts){ return new Date(ts).toLocaleDateString("es-MX",{day:"numeric",month:"short",year:"numeric"}); }
function applyTheme(){
  var r=document.documentElement;
  if(state.theme==="light"||state.theme==="dark") r.setAttribute("data-theme",state.theme); else r.removeAttribute("data-theme");
}
function toast(msg){
  var s=document.getElementById("toast-slot");
  s.innerHTML='<div class="toast" role="status">'+esc(msg)+'</div>';
  clearTimeout(toast._t); toast._t=setTimeout(function(){ s.innerHTML=""; },2200);
}
function hash(s){ var h=0; for(var i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))|0; } return Math.abs(h); }

/* ---------- vistas: estudiante ---------- */
function brandRow(right){
  return '<div class="row between"><div class="brand">'+iso()+'<span class="wm">Llave</span><span class="cuu">CUU</span></div>'+(right||"")+'</div>';
}
function bizItem(b){
  var fav = state.favs.indexOf(b.id)>-1;
  return '<div class="item" style="padding-right:0">'+
    '<button class="item" style="border:0;padding:0;flex:1" data-a="open" data-id="'+b.id+'" aria-label="Ver '+esc(b.name)+'">'+
      '<span class="ico">'+ic(b.cat)+'</span>'+
      '<span class="t"><h3>'+esc(b.name)+'</h3><span class="b" style="display:block">'+esc(b.benefit)+'</span>'+
      '<span class="m"><span>'+esc(b.zona)+'</span><span>'+esc(b.hours)+'</span></span></span>'+
    '</button>'+
    '<button class="heart'+(fav?" on":"")+'" data-a="fav" data-id="'+b.id+'" aria-pressed="'+fav+'" aria-label="'+(fav?"Quitar de guardados":"Guardar")+' '+esc(b.name)+'">'+HEART+'</button>'+
  '</div>';
}
function memberCard(){
  var u=state.user;
  return '<div class="card'+(ui.settled?"":" settle")+'" role="img" aria-label="Tarjeta de miembro de '+esc(u.name)+'">'+
    peaks()+
    '<div class="top">'+iso()+'<span class="wm">Llave</span><span class="cuu">CUU</span></div>'+
    '<div class="who"><div class="n">'+esc(u.name)+'</div><div class="u">'+esc(u.uni)+(u.origin?", de "+esc(u.origin):"")+'</div></div>'+
    '<div class="meta"><div><span>Miembro</span><b>'+esc(u.id)+'</b></div><div><span>Vigente hasta</span><b>'+fdate(u.until)+'</b></div></div>'+
  '</div>';
}
function viewHome(){
  var u=state.user, first=u.name.split(" ")[0];
  var done=FIRST_WEEK.filter(function(f){return state.checks.indexOf(f.id)>-1;}).length;
  var out='<div class="stack">'+brandRow('<button class="avatar" data-a="tab" data-t="profile" aria-label="Abrir perfil">'+esc(first.charAt(0).toUpperCase())+'</button>')+'</div>';
  out+='<div style="margin:26px 0 18px"><h1>Hola, '+esc(first)+'</h1><p class="muted" style="margin-top:6px">Tu Llave está activa. Muéstrala en los negocios aliados.</p></div>';
  out+=memberCard();
  out+='<div class="sec"><div class="row between"><h2>Tu primera semana en Chihuahua</h2></div>';
  out+='<p class="muted" style="margin-bottom:6px">'+(done===FIRST_WEEK.length?"Ya conoces lo básico de la ciudad.":done+" de "+FIRST_WEEK.length+" listos")+'</p><div style="border-top:1px solid var(--line)">';
  FIRST_WEEK.forEach(function(f){
    var on=state.checks.indexOf(f.id)>-1;
    out+='<div class="check'+(on?" done":"")+'"><button class="box" role="checkbox" aria-checked="'+on+'" data-a="check" data-id="'+f.id+'" aria-label="'+esc(f.text)+'">'+CHECK+'</button>'+
      '<span class="lbl">'+esc(f.text)+'</span><button class="link" data-a="go" data-c="'+f.cat+'">Ver opciones</button></div>';
  });
  out+='</div></div>';
  out+='<div class="sec"><h2>Para empezar esta semana</h2><div class="list" style="margin-top:10px">';
  BIZ.filter(function(b){return b.feat;}).slice(0,4).forEach(function(b){ out+=bizItem(b); });
  out+='</div></div>';
  return out;
}
function listHtml(){
  var q=ui.q.trim().toLowerCase();
  var arr=BIZ.filter(function(b){
    var okc = ui.filter==="todos" || (ui.filter==="guardados" ? state.favs.indexOf(b.id)>-1 : b.cat===ui.filter);
    var okq = !q || (b.name+" "+b.benefit+" "+b.zona+" "+cat(b.cat).label).toLowerCase().indexOf(q)>-1;
    return okc && okq;
  });
  if(!arr.length){
    return '<div class="empty"><h3>Sin resultados</h3><p class="muted" style="margin-top:6px">'+(ui.filter==="guardados"?"Guarda negocios con el corazón para verlos aquí.":"Prueba con otra palabra o quita el filtro.")+'</p></div>';
  }
  return '<div class="list">'+arr.map(bizItem).join("")+'</div>';
}
function viewExplore(){

  out+='<div class="search">'+ic("explore")+'<input class="inp" id="q" type="search" placeholder="Busca por nombre, zona o beneficio" value="'+esc(ui.q)+'" aria-label="Buscar negocios"></div>';

  out+='</div><div id="list">'+listHtml()+'</div>';

}
function viewRedeemed(){

  if(!state.redeemed.length){
    out+='<div class="empty"><p class="muted">Aún no has canjeado nada. Un desayuno 2×1 es un buen primer canje.</p><div style="margin-top:14px"><button class="btn small" data-a="tab" data-t="explore">Explorar negocios</button></div></div>';

function viewProfile(){
  var u=state.user;

  return out;

/* ---------- vistas: negocio ---------- */
function bizData(b){
  var base=[3,5,4,7,8,11,9,13], f=0.6+(hash(b.id)%9)/10;
  var w=base.map(function(n){return Math.max(1,Math.round(n*f));});
  var last4=w.slice(4).reduce(function(a,n){return a+n;},0);
  var rec=Math.round(last4*0.42), nue=last4-rec;
  var dbase=[4,6,5,7,9,8,2], dsum=dbase.reduce(function(a,n){return a+n;},0);
  var days=dbase.map(function(n){return Math.round(n/dsum*last4);});
  return {w:w,last4:last4,rec:rec,nue:nue,ret:Math.round(rec/last4*100),days:days};
}
function chartWeeks(w){
  var W=420,H=150,pad=8,bw=36,gap=(W-pad*2-bw*w.length)/(w.length-1),max=Math.max.apply(null,w);
  var s='<svg class="chart" viewBox="0 0 '+W+' '+(H+22)+'" role="img" aria-label="Canjes por semana durante las últimas 8 semanas">';
  w.forEach(function(n,i){
    var h=Math.max(4,Math.round(n/max*(H-20))), x=pad+i*(bw+gap), y=H-h, last=i===w.length-1;
    s+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+h+'" rx="4" fill="'+(last?"var(--ink)":"var(--bronze)")+'" fill-opacity="'+(last?1:.75)+'"/>';
    s+='<text x="'+(x+bw/2)+'" y="'+(y-5)+'" text-anchor="middle">'+n+'</text>';
  });
  s+='<text x="'+pad+'" y="'+(H+16)+'">hace 8 semanas</text><text x="'+(W-pad)+'" y="'+(H+16)+'" text-anchor="end">esta semana</text></svg>';
  return s;
}
function bizSelect(){
  var s='<label class="field"><span>Negocio</span><select class="inp" id="bizsel">';
  BIZ.forEach(function(b){ s+='<option value="'+b.id+'"'+(b.id===ui.bizId?" selected":"")+'>'+esc(b.name)+'</option>'; });
  return s+'</select></label>';
}
function viewPanel(){
  var b=biz(ui.bizId), d=bizData(b), names=["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"], mx=Math.max.apply(null,d.days);
  var out=brandRow('<span class="tag">Vista negocio</span>');
  out+='<div style="margin:24px 0 16px"><h1>'+esc(b.name)+'</h1><p class="muted" style="margin-top:6px">Panel de retención con datos de ejemplo.</p></div>'+bizSelect();
  out+='<div class="kpis" style="margin-top:18px"><div><div class="v">'+d.last4+'</div><div class="l">canjes en 4 semanas</div></div><div><div class="v">'+d.nue+'</div><div class="l">estudiantes nuevos</div></div><div><div class="v">'+d.ret+'%</div><div class="l">volvieron a canjear</div></div></div>';
  out+='<div class="sec"><h2>Canjes por semana</h2><div style="margin-top:10px">'+chartWeeks(d.w)+'</div></div>';
  out+='<div class="sec"><h2>Días con más canjes</h2><div style="margin-top:12px">';
  d.days.forEach(function(n,i){
    out+='<div class="row" style="margin-bottom:8px"><span style="width:34px;font-size:13px" class="muted">'+names[i]+'</span><span style="flex:1;height:10px;background:color-mix(in srgb,var(--bronze) 18%,transparent);border-radius:5px;overflow:hidden"><span style="display:block;height:100%;width:'+Math.round(n/mx*100)+'%;background:var(--bronze)"></span></span><span style="width:24px;text-align:right;font-size:13px">'+n+'</span></div>';
  });
  var mine=state.redeemed.filter(function(r){return r.bizId===b.id;}).length;
  out+='</div></div><p class="muted" style="margin-top:20px;font-size:13px">Canjes reales registrados en esta demo para este negocio: '+mine+'.</p>';
  out+='<div class="sec"><button class="btn ghost" data-a="modestudent">Volver a la vista de estudiante</button></div>';
  return out;
}
function viewValidate(){
  var b=biz(ui.bizId);
  var out=brandRow('<span class="tag">Vista negocio</span>');
  out+='<div style="margin:24px 0 16px"><h1>Validar código</h1><p class="muted" style="margin-top:6px">El estudiante te muestra su código de seis dígitos. Escríbelo aquí para confirmar el beneficio.</p></div>'+bizSelect();
  out+='<label class="field" style="margin-top:14px"><span>Código del estudiante</span><input class="inp" id="codeIn" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="000000" style="font-family:var(--serif);font-size:28px;letter-spacing:.12em;min-height:60px"></label>';
  out+='<div style="margin-top:14px"><button class="btn" data-a="validate">Validar código</button></div><div id="vres" aria-live="polite"></div>';
  out+='<p class="muted" style="margin-top:22px;font-size:13px">Para probarlo: genera un código para '+esc(b.name)+' desde la vista de estudiante y escríbelo aquí.</p>';
  return out;
}

/* ---------- onboarding ---------- */
function viewOnboard(){
  var out='<div class="hero">'+iso()+'<h1 style="margin-top:18px">Llave</h1><p class="muted" style="font-size:12px;letter-spacing:.22em;margin-top:4px">CUU</p>';
  out+='<h2 style="margin:26px 0 8px">Tu llave para conocer Chihuahua</h2><p class="muted">Beneficios en negocios locales de la ciudad, para estudiantes que llegan de fuera.</p></div>';
  out+='<div class="stack" style="margin-top:26px">';
  out+='<label class="field"><span>Tu nombre</span><input class="inp" id="ob-name" autocomplete="name" placeholder="Nombre y apellido"></label>';
  out+='<label class="field"><span>Universidad</span><select class="inp" id="ob-uni">'+UNIS.map(function(u){return '<option>'+esc(u)+'</option>';}).join("")+'</select></label>';
  out+='<label class="field"><span>¿De dónde vienes?</span><input class="inp" id="ob-origin" placeholder="Ciudad o municipio"></label>';
  out+='<button class="btn" data-a="onboard">Activar mi Llave</button><button class="btn ghost" data-a="demoprofile">Probar con un perfil de ejemplo</button></div>';
  out+='<p class="muted" style="margin-top:20px;font-size:13px">Versión de demostración: sin cobro y con negocios de ejemplo.</p>';
  return out;
}

/* ---------- hojas ---------- */
function openSheet(html){
  var l=document.getElementById("layer");
  l.innerHTML='<div class="backdrop" data-a="closebackdrop"><div class="sheet" role="dialog" aria-modal="true"><div class="grip"></div>'+html+'</div></div>';
  var f=l.querySelector("button.btn,button"); if(f) f.focus({preventScroll:true});
}
function closeSheet(){
  clearInterval(ui.timer); ui.timer=null;
  document.getElementById("layer").innerHTML="";
}
function sheetBiz(id){
  var b=biz(id), fav=state.favs.indexOf(id)>-1;
  var h='<div class="row"><span class="ico">'+ic(b.cat)+'</span><div><h2 style="font-size:25px">'+esc(b.name)+'</h2><p class="muted">'+esc(cat(b.cat).label)+'</p></div></div>';
  h+='<div class="benefit">'+esc(b.benefit)+'</div><p>'+esc(b.info)+'</p>';
  h+='<dl class="dl"><dt>Zona</dt><dd>'+esc(b.zona)+'</dd><dt>Horario</dt><dd>'+esc(b.hours)+'</dd><dt>Ahorro estimado</dt><dd>'+mxn(b.save)+'</dd><dt>Condiciones</dt><dd>Un canje por visita. Presenta tu código antes de pagar.</dd></dl>';
  h+='<div class="stack" style="margin-top:22px"><button class="btn" data-a="redeem" data-id="'+id+'">Canjear beneficio</button><button class="btn ghost" data-a="favsheet" data-id="'+id+'">'+(fav?"Quitar de guardados":"Guardar")+'</button></div>';
  openSheet(h);
}
function sheetCode(code){
  var c=state.codes[code]; if(!c) return;
  var b=biz(c.bizId), C=2*Math.PI*84;
  var h='<h2 style="font-size:25px">'+esc(b.name)+'</h2><p class="muted">'+esc(b.benefit)+'</p>';
  h+='<div class="codewrap" id="cw"><svg viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="84" fill="none" stroke="var(--line)" stroke-width="6"/><circle id="ring" cx="100" cy="100" r="84" fill="none" stroke="var(--bronze)" stroke-width="6" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="0"/></svg><div class="c"><div class="code" id="codeTxt">'+code+'</div><div class="muted" id="left" style="margin-top:6px;font-size:14px"></div></div></div>';
  h+='<p class="muted" style="text-align:center">Muestra este código en caja antes de pagar.</p>';
  h+='<div class="stack" style="margin-top:20px"><button class="btn" data-a="used" data-code="'+code+'">Ya lo usé</button><button class="btn ghost" data-a="close">Cerrar</button></div>';
  openSheet(h);
  function tick(){
    var left=c.expires-Date.now(), ring=document.getElementById("ring"), lt=document.getElementById("left"), cw=document.getElementById("cw");
    if(!ring){ clearInterval(ui.timer); return; }
    if(c.used){ lt.textContent="Canjeado"; cw.classList.add("expired"); ring.setAttribute("stroke-dashoffset",C); clearInterval(ui.timer); return; }
    if(left<=0){ lt.textContent="Expiró. Genera otro código."; cw.classList.add("expired"); ring.setAttribute("stroke-dashoffset",C); clearInterval(ui.timer); return; }
    var m=Math.floor(left/60000), s=Math.floor(left/1000)%60;
    lt.textContent="Expira en "+m+":"+(s<10?"0":"")+s;
    ring.setAttribute("stroke-dashoffset",(C*(1-left/300000)).toFixed(1));
  }
  clearInterval(ui.timer); tick(); ui.timer=setInterval(tick,500);
}

/* ---------- lógica ---------- */
function newCode(){
  var c; do{ c=String(Math.floor(Math.random()*900000)+100000); }while(state.codes[c]);
  return c;
}
function recordRedeem(c){
  if(c.used) return;
  c.used=true;
  var b=biz(c.bizId);
  state.redeemed.push({bizId:c.bizId, ts:Date.now(), save:b.save, code:c.code});
  save();
}
function makeUser(name,uni,origin){
  var now=new Date(), until=new Date(now); until.setMonth(until.getMonth()+4);
  return {name:name, uni:uni, origin:origin, id:"CUU-"+String(Math.floor(Math.random()*9000)+1000), since:now.getTime(), until:until.getTime()};
}

/* ---------- render ---------- */
var STUDENT_TABS=[["home","Inicio"],["explore","Explorar"],["redeemed","Canjes"],["profile","Perfil"]];
var BIZ_TABS=[["panel","Panel"],["validate","Validar"]];
function render(){
  applyTheme();
  var app=document.getElementById("app"), html="", tabs="";
  if(!state.user && ui.mode==="student"){
    html=viewOnboard();
  }else if(ui.mode==="business"){
    html = ui.btab==="panel" ? viewPanel() : viewValidate();
    tabs = BIZ_TABS.map(function(t){return '<button class="tab" data-a="btab" data-t="'+t[0]+'" '+(ui.btab===t[0]?'aria-current="page"':'')+'>'+ic(t[0])+'<span>'+t[1]+'</span></button>';}).join("");
  }else{
    var v={home:viewHome,explore:viewExplore,redeemed:viewRedeemed,profile:viewProfile}[ui.tab];
    html=v();
    tabs = STUDENT_TABS.map(function(t){return '<button class="tab" data-a="tab" data-t="'+t[0]+'" '+(ui.tab===t[0]?'aria-current="page"':'')+'>'+ic(t[0])+'<span>'+t[1]+'</span></button>';}).join("");
    if(ui.tab==="home") ui.settled=true;
  }
  app.innerHTML=html+(tabs?'<nav class="tabbar" aria-label="Navegación principal">'+tabs+'</nav>':"");
}

/* ---------- eventos ---------- */
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-a]"); if(!t) return;
  var a=t.dataset.a;
  if(a==="closebackdrop"){ if(e.target===t) closeSheet(); return; }
  switch(a){
    case "tab": ui.tab=t.dataset.t; render(); window.scrollTo(0,0); break;
    case "btab": ui.btab=t.dataset.t; render(); window.scrollTo(0,0); break;
    case "filter": ui.filter=t.dataset.f; render(); break;
    case "go": ui.filter=t.dataset.c; ui.q=""; ui.tab="explore"; render(); window.scrollTo(0,0); break;
    case "open": sheetBiz(t.dataset.id); break;
    case "fav": {
      var i=state.favs.indexOf(t.dataset.id);
      if(i>-1){ state.favs.splice(i,1); toast("Quitado de guardados"); } else { state.favs.push(t.dataset.id); toast("Guardado"); }
      save();
      if(ui.tab==="explore"){ document.getElementById("list").innerHTML=listHtml(); } else render();
      break; }
    case "favsheet": {
      var j=state.favs.indexOf(t.dataset.id);
      if(j>-1){ state.favs.splice(j,1); toast("Quitado de guardados"); } else { state.favs.push(t.dataset.id); toast("Guardado"); }
      save(); sheetBiz(t.dataset.id); render(); break; }
    case "check": {
      var k=state.checks.indexOf(t.dataset.id);
      if(k>-1) state.checks.splice(k,1); else state.checks.push(t.dataset.id);
      save(); render(); break; }
    case "redeem": {
      var code=newCode();
      state.codes[code]={code:code,bizId:t.dataset.id,expires:Date.now()+300000,used:false};
      save(); sheetCode(code); break; }
    case "opencode": sheetCode(t.dataset.code); break;
    case "used": {
      var c=state.codes[t.dataset.code];
      if(c){ recordRedeem(c); toast("Canje registrado"); }
      closeSheet(); render(); break; }
    case "close": closeSheet(); break;
    case "onboard": {
      var n=document.getElementById("ob-name").value.trim();
      if(!n){ toast("Escribe tu nombre para activar tu Llave"); document.getElementById("ob-name").focus(); break; }
      state.user=makeUser(n,document.getElementById("ob-uni").value,document.getElementById("ob-origin").value.trim());
      save(); ui.tab="home"; ui.settled=false; render(); break; }
    case "demoprofile":
      state.user=makeUser("Sofía Ramírez","UACH","Durango");
      save(); ui.tab="home"; ui.settled=false; render(); break;
    case "logout":
      if(window.confirm("Se borrarán tu perfil, guardados y canjes de este dispositivo. ¿Continuar?")){
        state={user:null,favs:[],checks:[],redeemed:[],codes:{},theme:state.theme}; save(); ui.tab="home"; ui.settled=false; render();
      } break;
    case "modebiz": ui.mode="business"; ui.btab="panel"; render(); window.scrollTo(0,0); break;
    case "modestudent": ui.mode="student"; ui.tab="home"; render(); window.scrollTo(0,0); break;
    case "validate": validate(); break;
  }
});
function validate(){
  var v=document.getElementById("codeIn").value.replace(/\D/g,""), r=document.getElementById("vres"), c=state.codes[v], b=biz(ui.bizId), now=Date.now();
  function show(cls,title,msg){ r.innerHTML='<div class="result '+cls+'"><h3>'+esc(title)+'</h3><p class="muted" style="margin-top:4px">'+esc(msg)+'</p></div>'; }
  if(v.length!==6) return show("bad","Código incompleto","Escribe los seis dígitos que ve el estudiante.");
  if(!c) return show("bad","Código no encontrado","Revisa los dígitos. Solo se validan códigos generados en este dispositivo durante la demo.");
  if(c.used) return show("bad","Código ya canjeado","Este beneficio ya se usó.");
  if(c.expires<=now) return show("bad","Código expirado","Pídele al estudiante que genere uno nuevo.");
  if(c.bizId!==b.id) return show("bad","Código de otro negocio","Este código es para "+biz(c.bizId).name+".");
  recordRedeem(c);
  show("ok","Código válido","Aplica: "+b.benefit+" para "+(state.user?state.user.name:"el estudiante")+".");
  toast("Canje registrado");
}
document.addEventListener("input",function(e){
  if(e.target.id==="q"){ ui.q=e.target.value; document.getElementById("list").innerHTML=listHtml(); }
});
document.addEventListener("change",function(e){
  if(e.target.id==="theme"){ state.theme=e.target.value; save(); render(); }
  if(e.target.id==="bizsel"){ ui.bizId=e.target.value; render(); }
});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape" && document.getElementById("layer").innerHTML) closeSheet();
  if(e.key==="Enter" && e.target.id==="codeIn") validate();
});

render();
})();
</script>
</body>
</html>
